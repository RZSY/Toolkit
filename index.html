<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toolkit</title>
    <meta name="description" content="A shelf of small web-based tools made because doing things manually got old. No ads, no subscriptions, no paywalls. Currently featuring Chartsmith, a chart generator.">
    <meta name="keywords" content="toolkit, web tools, chart generator, chartsmith, online utilities, developer tools">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Toolkit">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Toolkit">
    <meta property="og:description" content="A shelf of small web-based tools made because doing things manually got old. No ads, ever. Currently featuring Chartsmith, a chart generator.">
    <meta property="og:image" content="ico/tkico.jpg">
    <meta property="og:url" content="">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Toolkit">
    <meta name="twitter:description" content="A shelf of small web-based tools made because doing things manually got old. No ads, ever. Currently featuring Chartsmith, a chart generator.">
    <meta name="twitter:image" content="ico/tkico.jpg">

    <link rel="icon" type="image/jpeg" href="ico/tkico.jpg">
    <link rel="apple-touch-icon" href="ico/tkico.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #f4f4f4;
            --surface: #ffffff;
            --ink: #161616;
            --ink-soft: #525252;
            --accent: #0f62fe;
            --accent-ink: #ffffff;
            --tile-2: #262626;
            --tile-3: #4a6741;
            --tile-2-text: #f4f4f4;
            --tile-3-text: #f4f4f4;
        }

        html[data-theme="dark"] {
            --bg: #161616;
            --surface: #262626;
            --ink: #f4f4f4;
            --ink-soft: #c6c6c6;
            --accent: #4589ff;
            --accent-ink: #161616;
            --tile-2: #393939;
            --tile-3: #5c7a52;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'IBM Plex Sans', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--ink);
            margin: 0;
            min-height: 100vh;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        a { color: inherit; }

        /* ---- header ---- */
        .site-header {
            max-width: 1100px;
            margin: 0 auto;
            padding: 22px 24px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand img {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            display: block;
        }

        .brand .wordmark {
            font-weight: 700;
            font-size: 16px;
            letter-spacing: -0.01em;
            color: var(--ink);
        }

        .site-nav {
            display: flex;
            align-items: center;
            gap: 22px;
            font-size: 14px;
        }

        .site-nav a {
            text-decoration: none;
            color: var(--ink-soft);
        }

        .site-nav a:hover {
            color: var(--ink);
        }

        .theme-toggle {
            background: none;
            border: none;
            font-family: inherit;
            font-size: 14px;
            color: var(--ink-soft);
            cursor: pointer;
            padding: 0;
        }

        .theme-toggle:hover { color: var(--ink); }

        /* ---- hero / grid section ---- */
        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 56px 24px 40px;
        }

        .hero {
            display: grid;
            grid-template-columns: minmax(240px, 340px) 1fr;
            gap: 48px;
            align-items: start;
        }

        .hero-text h1 {
            font-size: 44px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin: 0 0 20px;
        }

        .hero-text p {
            font-size: 16px;
            line-height: 1.6;
            color: var(--ink-soft);
            margin: 0 0 28px;
            max-width: 40ch;
        }

        .search-field {
            width: 100%;
            border: none;
            border-bottom: 2px solid var(--ink-soft);
            background: transparent;
            font-family: inherit;
            font-size: 15px;
            color: var(--ink);
            padding: 8px 2px;
            margin-bottom: 28px;
            outline: none;
        }

        .search-field::placeholder { color: var(--ink-soft); }

        .search-field:focus { border-bottom-color: var(--accent); }

        .cta-button {
            display: inline-block;
            background: var(--accent);
            color: var(--accent-ink);
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            padding: 14px 24px;
        }

        .cta-button:hover { opacity: 0.88; }

        /* ---- tiles ---- */
        .tile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
            background: var(--bg);
        }

        .tile {
            position: relative;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            text-decoration: none;
            overflow: hidden;
            transition: opacity 0.15s ease;
        }

        .tile:hover { opacity: 0.92; }

        .tile-icon {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile-icon img {
            width: 62%;
            height: 62%;
            object-fit: contain;
        }

        .tile-fallback {
            display: none;
            width: 62%;
            height: 62%;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 48px;
        }

        .tile-label {
            padding: 16px 18px 18px;
            font-weight: 600;
            font-size: 15px;
        }

        .tile-brand {
            background: var(--accent);
            color: var(--accent-ink);
        }

        .tile-brand .tile-label {
            font-size: 20px;
            font-weight: 700;
        }

        .tile-1 { background: #d0e2ff; color: var(--ink); }
        html[data-theme="dark"] .tile-1 { background: #003a6d; color: #f4f4f4; }
        .tile-2 { background: var(--tile-2); color: var(--tile-2-text); }
        .tile-3 { background: var(--tile-3); color: var(--tile-3-text); }

        /* ---- footer ---- */
        footer {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 24px 40px;
            font-size: 13px;
            color: var(--ink-soft);
        }

        @media (max-width: 700px) {
            .hero { grid-template-columns: 1fr; }
            .tile-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>

<body>

    <header class="site-header">
        <a class="brand" href="#">
            <img src="ico/tkico.jpg" alt="">
            <span class="wordmark">Toolkit</span>
        </a>
        <nav class="site-nav">
            <a href="about.html">About</a>
            <a href="manual.pdf" target="_blank" rel="noopener">Manual</a>
            <button class="theme-toggle" id="theme-toggle" type="button">Dark mode</button>
        </nav>
    </header>

    <main>
        <div class="hero">

            <div class="hero-text">
                <h1>Toolkit</h1>
                <p>Small programs made because doing things manually got too tiring. Read the About for more information.</p>
                <input type="text" id="search" class="search-field" placeholder="Search tools...">
                <a class="cta-button" href="manual.pdf" target="_blank" rel="noopener">View the manual</a>
            </div>

            <div class="tile-grid" id="tile-grid">

                <div class="tile tile-brand">
                    <div class="tile-icon">
                        <img src="ico/tkico.jpg" alt="">
                    </div>
                    <div class="tile-label">Toolkit</div>
                </div>

                <!--
                  TEMPLATE — copy one of these <a class="tile"> blocks to add a new tool.
                  1. Change href to the tool's real page.
                  2. Set the img src to that tool's own ico/ file.
                  3. Alternate the tile-1 / tile-2 / tile-3 class for color variety.
                  4. Change the label text and fallback letter.
                -->

                <a class="tile tile-1" href="chartsmith.html">
                    <div class="tile-icon">
                        <img src="ico/csico.jpg" alt="" loading="lazy">
                        <div class="tile-fallback">C</div>
                    </div>
                    <div class="tile-label">Chartsmith</div>
                </a>

                <a class="tile tile-2" href="entity-family.html">
                    <div class="tile-icon">
                        <img src="ico/efico.jpg" alt="" loading="lazy">
                        <div class="tile-fallback">E</div>
                    </div>
                    <div class="tile-label">Entity Family</div>
                </a>

                <a class="tile tile-3" href="timeline-generator.html">
                    <div class="tile-icon">
                        <img src="ico/tbico.jpg" alt="" loading="lazy">
                        <div class="tile-fallback">T</div>
                    </div>
                    <div class="tile-label">Timeline Builder</div>
                </a>

            </div>
        </div>
    </main>

    <footer>
        Toolkit &copy; 2026 &middot; MIT Licensed &middot; No ads, ever.
    </footer>

    <script>
        // Theme toggle
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('theme'); } catch (e) {}
            var initial = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            var btn = document.getElementById('theme-toggle');

            function updateLabel() {
                var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                btn.textContent = isDark ? 'Light mode' : 'Dark mode';
            }

            if (initial === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            updateLabel();

            btn.addEventListener('click', function () {
                var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                if (isDark) {
                    document.documentElement.removeAttribute('data-theme');
                } else {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
                try { localStorage.setItem('theme', isDark ? 'light' : 'dark'); } catch (e) {}
                updateLabel();
            });
        })();

        // Icon fallback if a favicon file is missing.
        document.querySelectorAll('.tile:not(.tile-brand)').forEach(function (tile) {
            var img = tile.querySelector('.tile-icon img');
            var fallback = tile.querySelector('.tile-fallback');
            img.addEventListener('error', function () {
                img.style.display = 'none';
                fallback.style.display = 'flex';
            });
        });

        // Live search — filters the tool tiles, leaves the brand tile alone.
        var search = document.getElementById('search');
        var tiles = document.querySelectorAll('.tile-grid .tile:not(.tile-brand)');

        search.addEventListener('input', function () {
            var query = this.value.toLowerCase();
            tiles.forEach(function (tile) {
                var match = tile.innerText.toLowerCase().includes(query);
                tile.style.display = match ? 'flex' : 'none';
            });
        });
    </script>

</body>
</html>
