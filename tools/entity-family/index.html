<body>

<div id="topbar">
  <a href="../../index.html" class="btn" title="Back to Toolkit" style="text-decoration:none;">◂ Toolkit</a>
  <div class="divider"></div>
  <input id="diagramTitle" value="Untitled ERD" spellcheck="false">
  <div class="divider"></div>
  <button class="btn primary" id="btnAddTable">+ Table</button>
  <button class="btn" id="btnConnect">🔗 Connect</button>
  <div class="divider"></div>
  <select class="mini" id="selLineStyle" title="Connector line style">
    <option value="curved">Curved lines</option>
    <option value="straight">Straight lines</option>
    <option value="ortho">Orthogonal lines</option>
  </select>
  <select class="mini" id="selGrid" title="Canvas background">
    <option value="grid">Grid background</option>
    <option value="dots">Dot background</option>
    <option value="plain">Plain background</option>
  </select>
  <button class="btn icon" id="btnTheme" title="Toggle theme">☾</button>
  <div class="divider"></div>
  <button class="btn" id="btnExportJson">Export JSON</button>
  <button class="btn" id="btnExportSvg">Export SVG</button>
  <button class="btn" id="btnExportPng">Export PNG</button>
  <button class="btn" id="btnImport">Import</button>
  <input type="file" id="fileInput" accept="application/json">
  <div class="divider"></div>
  <button class="btn danger" id="btnClear">New</button>
  <div id="spacer"></div>
  <div class="zoomgroup">
    <button class="btn icon" id="zoomOut">−</button>
    <span id="zoomLabel">100%</span>
    <button class="btn icon" id="zoomIn">+</button>
    <button class="btn" id="zoomFit">Fit</button>
  </div>
  <button class="btn icon" id="btnHelp" title="Canvas controls">?</button>
</div>

<div id="main">
  <div id="canvasWrapper">
    <div id="world">
      <svg id="relLayer" width="6000" height="4000"></svg>
      <div id="tablesLayer"></div>
    </div>
    <div id="canvasHint"></div>
  </div>
  <div id="inspector"></div>
</div>
<div id="shortcutsPop" class="hidden">
  <div class="row"><span>Pan</span><b>Scroll / Space+drag / Middle-click</b></div>
  <div class="row"><span>Zoom</span><b>Ctrl/⌘ + scroll / pinch</b></div>
  <div class="row"><span>Zoom in / out</span><b>+ / −</b></div>
  <div class="row"><span>Reset zoom</span><b>0</b></div>
  <div class="row"><span>Fit to screen</span><b>Shift+F</b></div>
  <div class="row"><span>Cancel connect</span><b>Esc</b></div>
  <div class="row"><span>Delete selected</span><b>Delete</b></div>
</div>

<div id="toast"></div>
<datalist id="typeList"></datalist>

<script src="app.js"></script>
</body>
</html>
